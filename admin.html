<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WarTV Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #adminpanel, #login-area {
      width: 400px;
      margin-top: 50px;
      padding: 20px;
      border: 1px solid #ccc;
      background-color: white;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    #login-area {
      background-color: #e9e9e9;
    }
    h1 { color: #333; }
    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }
    input {
      margin-bottom: 10px;
      padding: 8px;
      width: 80%;
    }
    textarea {
      width: 90%;
      min-height: 50px;
      margin-bottom: 10px;
      padding: 5px;
    }
    .login-button {
      padding: 8px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    .login-button:hover { background-color: #0056b3; }
    #message { color: red; font-size: 14px; }
  </style>
</head>
<body>

  <div id="login-area">
    <label>Login to Admin Panel</label>
    <input type="text" placeholder="Username" id="username-input"><br>
    <input type="password" placeholder="Password" id="password-input"><br>
    <button id="login-btn" class="login-button">Login</button>
    <p id="message"></p>
  </div>

  <div id="adminpanel" style="display: none;">
    <h1>WarTV Admin Panel</h1>
    <hr>
    <label>Change news..</label>
    <textarea id="news-input" rows="1"></textarea>
    <button id="change-btn" class="login-button">Change</button>
  </div> 

  <script>
    const adminPanel = document.getElementById('adminpanel');
    const loginButton = document.getElementById('login-btn');
    const loginArea = document.getElementById('login-area');
    const message = document.getElementById('message');

    // Replace these with your actual desired credentials
    const REQUIRED_USERNAME = "admin"; 
    const REQUIRED_PASSWORD = "password123";

    loginButton.addEventListener('click', function() {
      const enteredUsername = document.getElementById('username-input').value;
      const enteredPassword = document.getElementById('password-input').value;

      if (enteredUsername === REQUIRED_USERNAME && enteredPassword === REQUIRED_PASSWORD) {
        loginArea.style.display = 'none';
        adminPanel.style.display = 'block'; 
      } else {
        message.textContent = "Invalid credentials, lol.";
      }
    });

    // Optional: Add functionality to the "Change" button
    document.getElementById('change-btn').addEventListener('click', () => {
        alert("News updated!");
    });
  </script>
</body>
</html>
